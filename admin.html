<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HypnoMind Admin</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f5f1e9}.admin-wrap{max-width:1200px;margin:55px auto;padding:0 22px}.admin-panel{background:white;padding:30px;box-shadow:0 12px 35px #18283d0c}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.admin-top h1{font:500 32px 'Playfair Display',serif}.admin-form{max-width:420px;margin:25px auto}.admin-form label{display:block;font-size:12px;margin:12px 0}.admin-form input{display:block;width:100%;padding:12px;border:1px solid #ddd;margin-top:5px}.admin-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.admin-actions button{padding:9px 14px;border:1px solid #d9b77a;background:white;cursor:pointer}.admin-filters{display:grid;grid-template-columns:minmax(220px,2fr) minmax(180px,1fr) minmax(150px,1fr);gap:10px;margin-top:20px}.admin-filters input,.admin-filters select{width:100%;padding:11px;border:1px solid #ddd;background:#fff}.admin-table{width:100%;border-collapse:collapse;margin-top:18px;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}.admin-table th{color:#8a704c;white-space:nowrap}.admin-table select{padding:6px}.query-code{font-weight:700;color:#9b7541;white-space:nowrap}.muted{color:#7a838d;font-size:12px}.hidden{display:none!important}@media(max-width:700px){.admin-filters{grid-template-columns:1fr}.admin-panel{padding:20px}.admin-table{display:block;overflow-x:auto}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">H</span><span>HYPNO<span class="brand-accent">MIND</span><small>Administration</small></span></a><a href="index.html">← View website</a></header><main class="admin-wrap"><div class="admin-panel"><div class="admin-top"><div><div class="section-kicker">HYPNOMIND / PRIVATE AREA</div><h1>Enquiry dashboard</h1><p class="muted">Sign in with an authorised Supabase admin account to view enquiries.</p></div><button id="logout" class="hidden">Sign out</button></div><form id="login-form" class="admin-form"><label>Email address<input type="email" id="admin-email" required></label><label>Password<input type="password" id="admin-password" required></label><button class="button button-gold" type="submit">Sign in</button><p id="admin-status" class="muted" role="status"></p></form><div id="dashboard" class="hidden"><div class="admin-actions"><strong id="count">0 enquiries</strong><button id="refresh">Refresh</button></div><div class="admin-filters"><input id="enquiry-search" type="search" placeholder="Search Query ID, name, phone, email or message"><select id="interest-filter"><option value="">All enquiry types</option></select><select id="status-filter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Completed</option></select></div><p id="dashboard-status" class="muted" role="status" aria-live="polite"></p><div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>Query ID</th><th>Date</th><th>Name / Contact</th><th>Interest</th><th>Message</th><th>Status</th></tr></thead><tbody id="enquiry-rows"></tbody></table></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
